<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8147359101264114"
     crossorigin="anonymous"></script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121417">

  <title id="pageTitle">Loading</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --page: #f5f3ee;
      --paper: #fffefa;
      --text: #272224;
      --muted: #756e70;
      --line: #e5ded8;
      --accent: #b85a7d;
      --accent-soft: #fff2f5;
      --shadow: 0 8px 24px rgba(39, 30, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px 20px;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      transition: background 0.2s ease;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    #app {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }

    #app.is-ready {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       NEW ANIMATED LOADING SCREEN
    ========================= */
    
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #181a20 0%, #0d0f12 100%);
      color: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-profile {
      display: flex;
      align-items: center;
      gap: 22px;
      animation: elegantPulse 2.5s infinite ease-in-out alternate;
    }

    .loader-avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #ffb6c1; /* Light pink thin border */
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 182, 193, 0.15);
      flex-shrink: 0;
    }

    .loader-avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .loader-text-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .loader-username {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 32px;
      font-weight: 700;
      font-family: "Manrope", sans-serif;
      letter-spacing: -0.02em;
    }

    .verified-badge {
      width: 26px;
      height: 26px;
      fill: #2398ff;
      filter: drop-shadow(0 0 8px rgba(35, 152, 255, 0.6));
    }

    .loader-displayname {
      font-size: 19px;
      color: #eaeaea;
      font-weight: 500;
      font-family: "Manrope", sans-serif;
    }

    @keyframes elegantPulse {
      0% { transform: translateY(0px) scale(0.98); opacity: 0.85; }
      100% { transform: translateY(-3px) scale(1.02); opacity: 1; }
    }

    /* =========================
       PAGE LAYOUT
    ========================= */

    .page-layout {
      display: grid;
      grid-template-columns: 365px minmax(0, 1fr);
      gap: 46px;
      width: min(1120px, 100%);
      margin: 0 auto;
      align-items: start;
    }

    #mainCard.card {
      position: sticky;
      top: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .profile-banner {
      width: 100%;
      height: 205px;
      background: #e8e1dc;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: height 0.2s ease;
    }

    .profile-main {
      padding: 0 20px 25px;
    }

    .ring-wrap {
      position: relative;
      display: flex;
      width: 106px;
      height: 106px;
      margin-top: -48px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 5px 15px rgba(40, 30, 34, 0.12);
      transition: border-radius 0.2s ease;
    }

    .ring {
      position: absolute;
      inset: -3px;
      z-index: 1;
      border: 2px solid var(--paper);
      border-radius: inherit;
      pointer-events: none;
    }

    #profilePhoto {
      position: relative;
      z-index: 2;
      display: none;
      width: 100%;
      height: 100%;
      border: 4px solid var(--paper);
      border-radius: inherit;
      object-fit: cover;
      object-position: center;
      filter: none !important;
      opacity: 1 !important;
      mix-blend-mode: normal !important;
      box-shadow: none !important;
      background: transparent !important;
      transition: border-radius 0.2s ease;
    }

    #profilePhoto.visible {
      display: block;
    }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 5px;
      z-index: 4;
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: #2fca76;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
    }

    .status-dot.visible {
      display: block;
    }

    .status-dot.away {
      background: #f0ad35;
    }

    .status-dot.offline {
      background: #999598;
    }

    #userName {
      min-height: 34px;
      margin: 0 0 4px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.3;
    }

    .status-text {
      min-height: 16px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    .quote-box {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
    }

    .quote-mark {
      display: none;
    }

    #dailyQuote {
      min-height: 18px;
      margin: 0;
      color: #5d4d53;
      font-family: "Fraunces", serif;
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.65;
    }

    .about {
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }

    .small-title {
      margin: 0 0 12px;
      color: #9a858b;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    #aboutTitle {
      min-height: 28px;
      margin: 0 0 13px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
    }

    #aboutText {
      min-height: 20px;
      margin: 0;
      color: #514a4c;
      font-family: "Fraunces", serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.8;
      white-space: pre-line;
    }

    .social {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: #494143;
      text-decoration: none;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .link-btn .icon {
      display: grid !important;
      width: 21px;
      height: 21px;
      font-size: 20px;
      place-items: center;
    }

    .links .link-btn > span:last-child {
      display: none;
    }

    .snap .icon::before { content: "\f2ab"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }
    .discord .icon::before { content: "\f392"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }
    .insta .icon::before { content: "\f16d"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }

    #whatsappSection {
      display: none !important;
    }

    footer {
      min-height: 15px;
      margin-top: 20px;
      color: #978d90;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-align: center;
    }

    .memory-area {
      min-width: 0;
      padding-top: 4px;
    }

    #memoryTitle {
      min-height: 44px;
      margin: 0 0 6px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.35;
    }

    #memorySubtitle {
      min-height: 20px;
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .polaroid {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      box-shadow: 0 5px 16px rgba(40, 30, 34, 0.05);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .polaroid:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(40, 30, 34, 0.10);
    }

    .polaroid .tape { display: none; }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      background: #e9e3df;
    }

    .polaroid .cap {
      display: block;
      margin: 0;
      padding: 13px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      text-align: left;
    }

    .empty-note {
      grid-column: 1 / -1;
      margin: 0;
      padding: 25px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(20, 16, 18, 0.88);
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      display: block;
      max-width: min(850px, 82vw);
      max-height: 80vh;
      border-radius: 7px;
      object-fit: contain;
    }

    .lb-close, .lb-nav {
      position: absolute;
      border: 0;
      color: #ffffff;
      cursor: pointer;
    }

    .lb-close {
      top: 18px;
      right: 22px;
      background: transparent;
      font-size: 34px;
      line-height: 1;
    }

    .lb-nav {
      top: 50%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      font-size: 25px;
      transform: translateY(-50%);
    }

    .lb-prev { left: 22px; }
    .lb-next { right: 22px; }

    .lb-caption {
      position: absolute;
      right: 20px;
      bottom: 22px;
      left: 20px;
      margin: 0;
      color: #ffffff;
      font-family: "Fraunces", serif;
      font-size: 19px;
      text-align: center;
    }

    /* =========================
       TABLET
    ========================= */
    @media (max-width: 820px) {
      body { padding: 18px 13px 32px; }
      .page-layout {
        grid-template-columns: 1fr;
        gap: 30px;
        width: min(600px, 100%);
      }
      #mainCard.card { position: relative; top: auto; }
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 500px) {
      body { padding: 10px; }
      
      /* Mobile adjustments for the new loading screen */
      .loader-profile {
        flex-direction: column;
        text-align: center;
        gap: 16px;
      }
      .loader-username {
        font-size: 26px;
        justify-content: center;
      }
      .loader-displayname { font-size: 17px; }

      .profile-banner { height: 155px; }
      .profile-main { padding: 0 16px 20px; }
      .ring-wrap {
        width: 92px;
        height: 92px;
        margin-top: -43px;
      }
      #userName { font-size: 24px; }
      #aboutTitle { font-size: 17px; }
      #aboutText { font-size: 14px; }
      #memoryTitle { font-size: 28px; }
      #memorySubtitle {
        margin-bottom: 17px;
        font-size: 12px;
      }
      .board {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .polaroid { width: 100%; }
      .polaroid img {
        min-height: 0;
        aspect-ratio: 4 / 5;
      }
      .polaroid .cap {
        padding: 14px 15px 16px;
        font-size: 16px;
      }
      .lightbox { padding: 14px; }
      .lightbox img {
        max-width: 95vw;
        max-height: 72vh;
      }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
      .lb-caption {
        right: 14px;
        bottom: 15px;
        left: 14px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body id="bodyRoot">

  <!-- NEW ANIMATED LOADING SCREEN (MATCHES INSTAGRAM STYLE) -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loader-profile">
      
      <!-- Rounded Profile Image with Light Pink Border -->
      <div class="loader-avatar-wrapper">
        <img src="https://i.ibb.co/2082XnHx/yellow-pfp.jpg" alt="Profile Loading">
      </div>

      <!-- Text Info (Username & Verified Badge) -->
      <div class="loader-text-info">
        <div class="loader-username">
          fl0werr_bbyy
          <!-- High Quality Verified Badge SVG -->
          <svg class="verified-badge" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.666 2.005C11.862 1.956 12.138 1.956 12.334 2.005L14.774 2.615C14.975 2.665 15.228 2.76 15.397 2.906L17.279 4.536C17.433 4.669 17.65 4.886 17.783 5.04L19.413 6.923C19.559 7.091 19.654 7.344 19.704 7.545L20.314 9.985C20.363 10.181 20.363 10.457 20.314 10.653L19.704 13.093C19.654 13.294 19.559 13.547 19.413 13.715L17.783 15.598C17.65 15.752 17.433 15.969 17.279 16.102L15.397 17.732C15.228 17.878 14.975 17.973 14.774 18.023L12.334 18.633C12.138 18.682 11.862 18.682 11.666 18.633L9.226 18.023C9.025 17.973 8.772 17.878 8.603 17.732L6.721 16.102C6.567 15.969 6.35 15.752 6.217 15.598L4.587 13.715C4.441 13.547 4.346 13.294 4.296 13.093L3.686 10.653C3.637 10.457 3.637 10.181 3.686 9.985L4.296 7.545C4.346 7.344 4.441 7.091 4.587 6.923L6.217 5.04C6.35 4.886 6.567 4.669 6.721 4.536L8.603 2.906C8.772 2.76 9.025 2.665 9.226 2.615L11.666 2.005Z" fill="#1DA1F2"/>
            <path d="M10.233 14.283L7.756 11.806L8.817 10.745L10.233 12.161L15.183 7.211L16.244 8.272L10.233 14.283Z" fill="white"/>
          </svg>
        </div>
        <div class="loader-displayname">
          Arushi 🤍🌸
        </div>
      </div>

    </div>
  </div>

  <div id="app" class="is-loading">

    <div class="page-layout">

      <!-- LEFT PROFILE SECTION -->

      <main class="card" id="mainCard">

        <div class="profile-banner" id="profileBanner"></div>

        <div class="profile-main">

          <div class="ring-wrap">
            <div class="ring" id="ringEl"></div>

            <img
              id="profilePhoto"
              src=""
              alt="Profile photo"
            >

            <span class="status-dot" id="statusDot"></span>
          </div>

          <h1 id="userName"></h1>

          <p class="status-text" id="statusText"></p>

          <div class="quote-box" id="quoteBox">
            <span class="quote-mark">“</span>
            <p id="dailyQuote"></p>
          </div>

          <section class="about">
            <p class="small-title">About</p>

            <h2 id="aboutTitle"></h2>

            <p id="aboutText"></p>
          </section>

          <section class="social" id="socialSection">
            <p class="small-title">Links</p>

            <div class="links" id="linksWrap">

              <a
                href="#"
                id="snapLink"
                class="link-btn snap"
                target="_blank"
                rel="noopener"
                aria-label="Snapchat"
                title="Snapchat"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Snapchat</span>
              </a>

              <a
                href="#"
                id="discordLink"
                class="link-btn discord"
                target="_blank"
                rel="noopener"
                aria-label="Discord"
                title="Discord"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Discord</span>
              </a>

              <a
                href="#"
                id="instaLink"
                class="link-btn insta"
                target="_blank"
                rel="noopener"
                aria-label="Instagram"
                title="Instagram"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Instagram</span>
              </a>

            </div>

            <div class="whatsapp-section" id="whatsappSection">

              <button
                id="waBtn"
                class="whatsapp locked"
                type="button"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>WhatsApp Locked</span>
              </button>

              <div id="waRequestForm" class="wa-form hidden">
                <p class="wa-note">
                  Enter your Gmail to request WhatsApp access.
                </p>

                <input
                  type="email"
                  id="waGmail"
                  placeholder="you@gmail.com"
                  autocomplete="email"
                >

                <button id="waSubmit" class="btn-primary" type="button">
                  Send Request
                </button>

                <p id="waMsg" class="wa-msg"></p>
              </div>
            </div>
          </section>

          <footer>
            <span id="footerName"></span>
          </footer>

        </div>
      </main>

      <!-- RIGHT FIRESTORE MEMORY GALLERY -->

      <section class="memory-area" id="memorySection">

        <h2 id="memoryTitle"></h2>

        <p id="memorySubtitle"></p>

        <main class="board" id="board" aria-live="polite">

          <p class="empty-note" id="boardLoading">
            Loading memories…
          </p>

          <p
            class="empty-note"
            id="boardEmpty"
            style="display:none;"
          >
            No memories added yet.
          </p>

          <p
            class="empty-note"
            id="boardError"
            style="display:none;color:#b85a7d;"
          >
            Could not load memories.
          </p>

        </main>
      </section>
    </div>
  </div>

  <!-- MEMORY IMAGE VIEWER -->

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Memory image preview"
  >
    <button
      class="lb-close"
      id="lbClose"
      type="button"
      aria-label="Close image preview"
    >
      ×
    </button>

    <button
      class="lb-nav lb-prev"
      id="lbPrev"
      type="button"
      aria-label="Previous memory"
    >
      ←
    </button>

    <img id="lbImg" src="" alt="">

    <button
      class="lb-nav lb-next"
      id="lbNext"
      type="button"
      aria-label="Next memory"
    >
      →
    </button>

    <p id="lbCaption" class="lb-caption"></p>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="memories.js"></script>

  <!-- FAIL-SAFE SCRIPT -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const app = document.getElementById('app');
        const loader = document.getElementById('loadingScreen');
        
        if (app && !app.classList.contains('is-ready')) {
          app.classList.add('is-ready');
          app.classList.remove('is-loading');
        }
        if (loader && !loader.classList.contains('hide')) {
          loader.classList.add('hide');
        }
      }, 2500); 
    });
  </script>

</body>
</html>
