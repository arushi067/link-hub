<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Arushi Patel</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
body, .emoji-ios {
  font-family: "Apple Color Emoji", "Poppins", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}

.memories-arrow {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  padding: 12px 20px;
  border-radius: 14px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.25);
  color: inherit;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: transform 0.2s, background 0.2s;
}
.memories-arrow:hover {
  background: rgba(255,255,255,0.28);
  transform: translateY(-2px);
}
.memories-arrow .arrow-icon {
  font-size: 16px;
  transition: transform 0.2s;
}
.memories-arrow:hover .arrow-icon {
  transform: translateX(4px);
}
</style>
</head>
<body id="bodyRoot">
  <div class="aurora" id="auroraLayer">
    <div class="aurora-shape shape1"></div>
    <div class="aurora-shape shape2"></div>
    <div class="aurora-shape shape3"></div>
  </div>
  <div class="particles" id="particles"></div>

  <main class="card" id="mainCard">
    <div class="ring-wrap">
      <div class="ring" id="ringEl"></div>
      <img id="profilePhoto" src="https://via.placeholder.com/160" alt="Profile Photo">
      <span class="status-dot" id="statusDot"></span>
    </div>

    <h1 id="userName">Loading...</h1>
    <p class="status-text" id="statusText"></p>

    <div class="quote-box" id="quoteBox">
      <span class="quote-mark">"</span>
      <p id="dailyQuote">Loading today's quote...</p>
    </div>

    <div class="links" id="linksWrap">
      <a href="#" id="snapLink" class="link-btn snap" target="_blank"><span class="icon"></span><span>Snapchat</span></a>
      <a href="#" id="discordLink" class="link-btn discord" target="_blank"><span class="icon"></span><span>Discord</span></a>
      <a href="#" id="instaLink" class="link-btn insta" target="_blank"><span class="icon"></span><span>Instagram</span></a>
    </div>

    <div class="whatsapp-section">
      <button id="waBtn" class="link-btn whatsapp locked"><span class="icon"></span><span>WhatsApp Locked</span></button>
      <div id="waRequestForm" class="wa-form hidden">
        <p class="wa-note">Enter your Gmail to request access. Approved manually.</p>
        <input type="email" id="waGmail" placeholder="you@gmail.com">
        <button id="waSubmit" class="btn-primary">Send Request</button>
        <p id="waMsg" class="wa-msg"></p>
      </div>
    </div>

    <a href="memories.html" class="memories-arrow">
      <span class="emoji-ios">📷</span>
      <span>View Memories</span>
      <span class="arrow-icon">➜</span>
    </a>

    <footer>
      <span class="footer-heart"></span>
      <span id="footerName">Arushi Patel</span>
      <span class="footer-heart"></span>
    </footer>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
