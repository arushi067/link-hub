<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff8ebe">
  <title id="pageTitle">Arushi Patel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root{--ink:#51273a;--pink:#ff4f91;--purple:#7568ff}*{box-sizing:border-box}body{min-height:100svh;overflow-x:hidden;font-family:Poppins,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.emoji-ios{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
    #mainCard.card{position:relative;z-index:2;width:min(390px,calc(100vw - 38px));margin:clamp(24px,6vh,64px) auto 30px;padding:30px 28px 24px;overflow:hidden;border:1px solid rgba(255,255,255,.7);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,225,240,.28));box-shadow:0 22px 54px rgba(131,36,83,.2),inset 0 1px rgba(255,255,255,.75);backdrop-filter:blur(10px);transform:perspective(1000px) rotateX(1.5deg);transition:transform .25s,box-shadow .25s}#mainCard.card::before{content:"";position:absolute;z-index:-1;inset:9px -8px -12px 9px;border-radius:30px;background:linear-gradient(135deg,rgba(255,73,151,.22),rgba(117,104,255,.15));filter:blur(2px)}#mainCard.card::after{content:"";position:absolute;z-index:-1;top:0;left:10%;width:80%;height:19%;border-radius:0 0 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none}@media(hover:hover){#mainCard.card:hover{transform:perspective(1000px) rotateY(-1.5deg) translateY(-5px);box-shadow:0 30px 65px rgba(131,36,83,.25),inset 0 1px rgba(255,255,255,.75)}}
    .ring-wrap{position:relative;z-index:3;filter:drop-shadow(0 8px 11px rgba(205,44,110,.2))}.ring{opacity:.85}#profilePhoto{position:relative;z-index:4!important;display:block!important;filter:none!important;opacity:1!important;mix-blend-mode:normal!important;box-shadow:none!important;background:transparent!important}.status-dot{z-index:5!important}
    .links{gap:12px!important}.link-btn{display:flex!important;align-items:center!important;justify-content:center!important;gap:11px!important;min-height:48px}.link-btn .icon{display:grid!important;place-items:center!important;width:22px!important;height:22px!important;font-size:19px!important}.snap .icon::before{content:"\f2ab";font-family:"Font Awesome 6 Brands";font-weight:400}.discord .icon::before{content:"\f392";font-family:"Font Awesome 6 Brands";font-weight:400}.insta .icon::before{content:"\f16d";font-family:"Font Awesome 6 Brands";font-weight:400}.whatsapp .icon::before{content:"\f232";font-family:"Font Awesome 6 Brands";font-weight:400}
    .memories-arrow{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;margin:17px 0 1px;overflow:hidden;border:1px solid rgba(255,255,255,.74);border-radius:15px;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,210,231,.5));box-shadow:0 10px 20px rgba(165,45,95,.1),inset 0 1px rgba(255,255,255,.85);color:var(--ink);font-size:13px;font-weight:800;text-decoration:none;transition:.2s}.memories-arrow::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 27%,rgba(255,255,255,.8) 48%,transparent 70%);transform:translateX(-130%);transition:transform .55s}.memories-arrow:hover::before{transform:translateX(130%)}.memories-arrow:hover{transform:translateY(-2px);box-shadow:0 15px 25px rgba(165,45,95,.18)}.memories-arrow>*{position:relative}.gallery-badge{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#ff6fa7,#9175ff);color:#fff;font-size:14px}.arrow-icon{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(255,79,145,.13);color:var(--pink);font-size:17px}.memory-hint{margin-top:7px;color:rgba(81,39,58,.57);font-size:9px;font-weight:700;letter-spacing:.06em;text-align:center}
    @media(max-width:600px){body{padding:0;background-size:cover}#mainCard.card{width:calc(100vw - 28px);margin:16px auto 18px;padding:22px 19px 18px;border-radius:25px;transform:none}.ring-wrap{transform:scale(.88);margin:-7px auto -4px}#userName{font-size:24px!important}.status-text{font-size:11px!important}.quote-box{margin:14px 0!important;padding:12px!important}.quote-box p{font-size:13px!important}.link-btn{min-height:45px!important;font-size:13px!important}.links{gap:9px!important}.whatsapp-section{margin-top:9px!important}.memories-arrow{min-height:45px;margin-top:14px;font-size:12px}.memory-hint{font-size:8px}footer{margin-top:17px!important;font-size:11px!important}.particles{opacity:.75!important}.aurora{opacity:.88!important}}
  </style>
</head>
<body id="bodyRoot">
  <div class="aurora" id="auroraLayer"><div class="aurora-shape shape1"></div><div class="aurora-shape shape2"></div><div class="aurora-shape shape3"></div></div>
  <div class="particles" id="particles"></div>
  <main class="card" id="mainCard">
    <div class="ring-wrap"><div class="ring" id="ringEl"></div><img id="profilePhoto" src="https://via.placeholder.com/160" alt="Profile photo"><span class="status-dot" id="statusDot"></span></div>
    <h1 id="userName">Loading...</h1><p class="status-text" id="statusText"></p>
    <div class="quote-box" id="quoteBox"><span class="quote-mark">“</span><p id="dailyQuote">Loading today’s quote...</p></div>
    <div class="links" id="linksWrap"><a href="#" id="snapLink" class="link-btn snap" target="_blank" rel="noopener"><span class="icon" aria-hidden="true"></span><span>Snapchat</span></a><a href="#" id="discordLink" class="link-btn discord" target="_blank" rel="noopener"><span class="icon" aria-hidden="true"></span><span>Discord</span></a><a href="#" id="instaLink" class="link-btn insta" target="_blank" rel="noopener"><span class="icon" aria-hidden="true"></span><span>Instagram</span></a></div>
    <div class="whatsapp-section"><button id="waBtn" class="link-btn whatsapp locked" type="button"><span class="icon" aria-hidden="true"></span><span>WhatsApp Locked</span></button><div id="waRequestForm" class="wa-form hidden"><p class="wa-note">Enter your Gmail to request access. Approved manually.</p><input type="email" id="waGmail" placeholder="you@gmail.com" autocomplete="email"><button id="waSubmit" class="btn-primary" type="button">Send Request</button><p id="waMsg" class="wa-msg"></p></div></div>
    <a href="memories.html" class="memories-arrow" aria-label="Open memory gallery"><span class="gallery-badge emoji-ios">📸</span><span>Explore Memory Gallery</span><span class="arrow-icon" aria-hidden="true">→</span></a><p class="memory-hint">TAP TO OPEN THE PHOTO STORY</p>
    <footer><span class="emoji-ios">💗</span><span id="footerName">Arushi Patel</span><span class="emoji-ios">💗</span></footer>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
