<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Arushi Patel</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isInstagram = /Instagram/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var alreadyTried = sessionStorage.getItem("igRedirectTried");
  if (isInstagram && isIOS && !alreadyTried) {
    sessionStorage.setItem("igRedirectTried", "1");
    var currentUrl = window.location.href;
    document.write(
      '<div style="position:fixed;inset:0;z-index:99999;background:#0d0d1a;color:#fff;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'font-family:sans-serif;text-align:center;padding:30px;">' +
      '<div style="font-size:40px;margin-bottom:14px;">🔗</div>' +
      '<h2 style="margin-bottom:10px;font-size:18px;">Opening in Safari...</h2>' +
      '<p style="font-size:13px;opacity:0.75;margin-bottom:22px;max-width:280px;">' +
      'This page works best outside Instagram\'s built-in browser.</p>' +
      '<a id="igManualLink" href="' + currentUrl + '" ' +
      'style="background:linear-gradient(135deg,#ff5fa2,#7f5fff);color:#fff;' +
      'padding:14px 26px;border-radius:14px;text-decoration:none;font-weight:600;font-size:14px;">' +
      'Tap here if it doesn\'t open automatically</a></div>'
    );
    setTimeout(function () { window.location.href = "x-safari-" + currentUrl; }, 300);
    setTimeout(function () { window.location.href = currentUrl; }, 1200);
  }
})();
</script>

<style>
/* ===== NEXT PAGE BUTTON ===== */
.next-page-btn {
  position: fixed; top: 50%; right: 18px; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent, #ff5fa2), var(--secondary, #7f5fff));
  color: #fff; display: flex; align-items: center; justify-content: center;
  text-decoration: none; font-size: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  z-index: 500; transition: transform 0.3s ease, box-shadow 0.3s ease;
  animation: nextPulse 2.4s infinite ease-in-out;
}
.next-page-btn:hover { transform: translateY(-50%) scale(1.12); }
@keyframes nextPulse {
  0%, 100% { box-shadow: 0 4px 14px rgba(255,95,162,0.35); }
  50% { box-shadow: 0 4px 22px rgba(127,95,255,0.55); }
}

.meta-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:6px; }
.meta-chip { font-size:11px; opacity:0.75; background:rgba(0,0,0,0.06); padding:4px 10px; border-radius:12px; }

/* ===== PROFILE PHOTO - NO BORDER, GUARANTEED ANIMATION ===== */
.ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 14px; }
.ring-wrap #ringEl { display: none; }
#profilePhoto {
  width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
  border: none; box-shadow: 0 4px 18px rgba(0,0,0,0.2);
  display: block;
}
.status-dot {
  position: absolute; bottom: 4px; right: 4px; width: 18px; height: 18px;
  border-radius: 50%; border: 3px solid #fff; background: #2ecc71;
}

/* ===== GUARANTEED BACKGROUND ANIMATION ===== */
#auroraLayer {
  position: fixed; inset: 0; z-index: -3; overflow: hidden;
  background: linear-gradient(135deg, #ffe3ef, #ffd6ec, #ffe9f5, #ffcfe8);
  background-size: 300% 300%;
  animation: auroraShift 14s ease infinite;
}
@keyframes auroraShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.aurora-shape {
  position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55;
  animation: floatBlob 10s ease-in-out infinite;
}
.shape1 { width: 260px; height: 260px; background: #ff9ecb; top: 5%; left: 8%; animation-delay: 0s; }
.shape2 { width: 220px; height: 220px; background: #b98cff; top: 55%; left: 65%; animation-delay: 2.5s; }
.shape3 { width: 200px; height: 200px; background: #ffd1e6; top: 70%; left: 15%; animation-delay: 5s; }
@keyframes floatBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -30px) scale(1.15); }
}

#bgVideo {
  position: fixed; top: 50%; left: 50%; width: 100vw; height: 100vh; min-width:100%; min-height:100%;
  transform: translate(-50%, -50%); object-fit: cover; z-index: -2; display:none;
}
.video-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: -1; pointer-events:none; display:none; }

@media (max-width: 480px) { .next-page-btn { width: 42px; height: 42px; right: 12px; font-size: 18px; } }
</style>
</head>
<body id="bodyRoot">
<div class="aurora" id="auroraLayer">
  <div class="aurora-shape shape1"></div>
  <div class="aurora-shape shape2"></div>
  <div class="aurora-shape shape3"></div>
</div>
<div class="particles" id="particles"></div>

<video id="bgVideo" autoplay muted loop playsinline preload="auto"></video>
<div class="video-overlay" id="videoOverlay"></div>

<a href="memories.html" class="next-page-btn" title="View Memories">➜</a>

<main class="card" id="mainCard">
  <div class="ring-wrap">
    <div class="ring" id="ringEl"></div>
    <img id="profilePhoto" src="https://via.placeholder.com/160" alt="Profile Photo">
    <span class="status-dot" id="statusDot"></span>
  </div>

  <h1 id="userName">Loading...</h1>
  <p class="status-text" id="statusText"></p>
  <div class="meta-row" id="metaRow"></div>

  <div class="quote-box" id="quoteBox">
    <span class="quote-mark">"</span>
    <p id="dailyQuote">Loading today's quote...</p>
  </div>

  <div class="links" id="linksWrap">
    <a href="#" id="snapLink" class="link-btn snap" target="_blank"><span class="icon">👻</span><span>Snapchat</span></a>
    <a href="#" id="discordLink" class="link-btn discord" target="_blank"><span class="icon">🎮</span><span>Discord</span></a>
    <a href="#" id="instaLink" class="link-btn insta" target="_blank"><span class="icon">📸</span><span>Instagram</span></a>
    <a href="#" id="customLink1" class="link-btn custom1 hidden" target="_blank"><span class="icon">🔗</span><span id="customLink1Text"></span></a>
    <a href="#" id="customLink2" class="link-btn custom2 hidden" target="_blank"><span class="icon">🔗</span><span id="customLink2Text"></span></a>
  </div>

  <div class="whatsapp-section">
    <button id="waBtn" class="link-btn whatsapp locked"><span class="icon">🔒</span><span>WhatsApp — Locked</span></button>
    <div id="waRequestForm" class="wa-form hidden">
      <p class="wa-note">Enter your Gmail to request access. Approved manually 💌</p>
      <input type="email" id="waGmail" placeholder="you@gmail.com">
      <button id="waSubmit" class="btn-primary">Send Request</button>
      <p id="waMsg" class="wa-msg"></p>
    </div>
  </div>

  <footer><span class="footer-heart">✦</span> <span id="footerName">Arushi Patel</span> <span class="footer-heart">✦</span></footer>
</main>

<audio id="clickSound" preload="auto"></audio>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
