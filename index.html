<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ee">

  <title id="pageTitle">Loading</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --page: #f5f3ee;
      --paper: #fffefa;
      --text: #272224;
      --muted: #756e70;
      --line: #e5ded8;
      --accent: #b85a7d;
      --accent-soft: #fff2f5;
      --shadow: 0 8px 24px rgba(39, 30, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px 20px;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      transition: background 0.2s ease;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /*
      The real page is hidden until Firebase finishes loading.
      This prevents saved/default text from flashing during refresh.
    */
    #app {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }

    #app.is-ready {
      opacity: 1;
      visibility: visible;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       PAGE LAYOUT
    ========================= */

    .page-layout {
      display: grid;
      grid-template-columns: 365px minmax(0, 1fr);
      gap: 46px;
      width: min(1120px, 100%);
      margin: 0 auto;
      align-items: start;
    }

    /* =========================
       LEFT PROFILE CARD
    ========================= */

    #mainCard.card {
      position: sticky;
      top: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    /*
      Banner is set by script.js from Firebase.
      It begins neutral to avoid a hard-coded banner image showing.
    */
    .profile-banner {
      width: 100%;
      height: 205px;
      background: #e8e1dc;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: height 0.2s ease;
    }

    .profile-main {
      padding: 0 20px 25px;
    }

    /*
      Profile picture overlaps the banner.
      It is clean with no white visual layer over the actual photo.
    */
    .ring-wrap {
      position: relative;
      display: flex;
      width: 106px;
      height: 106px;
      margin-top: -48px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 5px 15px rgba(40, 30, 34, 0.12);
      transition: border-radius 0.2s ease;
    }

    .ring {
      position: absolute;
      inset: -3px;
      z-index: 1;
      border: 2px solid var(--paper);
      border-radius: inherit;
      pointer-events: none;
    }

    #profilePhoto {
      position: relative;
      z-index: 2;
      display: none;
      width: 100%;
      height: 100%;
      border: 4px solid var(--paper);
      border-radius: inherit;
      object-fit: cover;
      object-position: center;
      filter: none !important;
      opacity: 1 !important;
      mix-blend-mode: normal !important;
      box-shadow: none !important;
      background: transparent !important;
      transition: border-radius 0.2s ease;
    }

    #profilePhoto.visible {
      display: block;
    }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 5px;
      z-index: 4;
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: #2fca76;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
    }

    .status-dot.visible {
      display: block;
    }

    .status-dot.away {
      background: #f0ad35;
    }

    .status-dot.offline {
      background: #999598;
    }

    #userName {
      min-height: 34px;
      margin: 0 0 4px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.3;
    }

    .status-text {
      min-height: 16px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    /* =========================
       QUOTE
    ========================= */

    /*
      Quote is directly below the status text.
    */
    .quote-box {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
    }

    .quote-mark {
      display: none;
    }

    #dailyQuote {
      min-height: 18px;
      margin: 0;
      color: #5d4d53;
      font-family: "Fraunces", serif;
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.65;
    }

    /* =========================
       ABOUT
    ========================= */

    .about {
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }

    .small-title {
      margin: 0 0 12px;
      color: #9a858b;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    #aboutTitle {
      min-height: 28px;
      margin: 0 0 13px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
    }

    #aboutText {
      min-height: 20px;
      margin: 0;
      color: #514a4c;
      font-family: "Fraunces", serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* =========================
       SIMPLE LINKS
    ========================= */

    .social {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    /*
      Simple outline buttons:
      Snapchat / Discord / Instagram logos only.
    */
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: #494143;
      text-decoration: none;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .link-btn .icon {
      display: grid !important;
      width: 21px;
      height: 21px;
      font-size: 20px;
      place-items: center;
    }

    /*
      Hides written button labels.
      Each app still has aria-label and title for accessibility.
    */
    .links .link-btn > span:last-child {
      display: none;
    }

    .snap .icon::before {
      content: "\f2ab";
      font-family: "Font Awesome 6 Brands";
      font-weight: 400;
    }

    .discord .icon::before {
      content: "\f392";
      font-family: "Font Awesome 6 Brands";
      font-weight: 400;
    }

    .insta .icon::before {
      content: "\f16d";
      font-family: "Font Awesome 6 Brands";
      font-weight: 400;
    }

    /*
      WhatsApp is completely hidden on the public page.
      The elements remain in HTML so existing script.js does not fail.
    */
    #whatsappSection {
      display: none !important;
    }

    footer {
      min-height: 15px;
      margin-top: 20px;
      color: #978d90;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-align: center;
    }

    /* =========================
       RIGHT MEMORY GALLERY
    ========================= */

    .memory-area {
      min-width: 0;
      padding-top: 4px;
    }

    #memoryTitle {
      min-height: 44px;
      margin: 0 0 6px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.35;
    }

    #memorySubtitle {
      min-height: 20px;
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /*
      memories.js dynamically creates .polaroid cards inside #board.
    */
    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .polaroid {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      box-shadow: 0 5px 16px rgba(40, 30, 34, 0.05);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .polaroid:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(40, 30, 34, 0.10);
    }

    .polaroid .tape {
      display: none;
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      background: #e9e3df;
    }

    .polaroid .cap {
      display: block;
      margin: 0;
      padding: 13px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      text-align: left;
    }

    .empty-note {
      grid-column: 1 / -1;
      margin: 0;
      padding: 25px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* =========================
       MEMORY IMAGE POPUP
    ========================= */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(20, 16, 18, 0.88);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: min(850px, 82vw);
      max-height: 80vh;
      border-radius: 7px;
      object-fit: contain;
    }

    .lb-close,
    .lb-nav {
      position: absolute;
      border: 0;
      color: #ffffff;
      cursor: pointer;
    }

    .lb-close {
      top: 18px;
      right: 22px;
      background: transparent;
      font-size: 34px;
      line-height: 1;
    }

    .lb-nav {
      top: 50%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      font-size: 25px;
      transform: translateY(-50%);
    }

    .lb-prev {
      left: 22px;
    }

    .lb-next {
      right: 22px;
    }

    .lb-caption {
      position: absolute;
      right: 20px;
      bottom: 22px;
      left: 20px;
      margin: 0;
      color: #ffffff;
      font-family: "Fraunces", serif;
      font-size: 19px;
      text-align: center;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 820px) {
      body {
        padding: 18px 13px 32px;
      }

      .page-layout {
        grid-template-columns: 1fr;
        gap: 30px;
        width: min(600px, 100%);
      }

      #mainCard.card {
        position: relative;
        top: auto;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .profile-banner {
        height: 155px;
      }

      .profile-main {
        padding: 0 16px 20px;
      }

      .ring-wrap {
        width: 92px;
        height: 92px;
        margin-top: -43px;
      }

      #userName {
        font-size: 24px;
      }

      #aboutTitle {
        min-height: auto;
        font-size: 17px;
      }

      #aboutText {
        min-height: auto;
        font-size: 14px;
      }

      #memoryTitle {
        min-height: auto;
        font-size: 28px;
      }

      #memorySubtitle {
        margin-bottom: 17px;
        font-size: 12px;
      }

      /*
        IMPORTANT MOBILE FIX:

        Every memory card is vertical.
        Image is at top.
        Caption is directly below the image.
        There is no side-by-side grid.
      */
      .board {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .polaroid {
        display: block;
        width: 100%;
        overflow: hidden;
      }

      .polaroid img {
        display: block;
        width: 100%;
        height: auto;
        min-height: 0;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        object-position: center;
      }

      .polaroid .cap {
        display: block;
        margin: 0;
        padding: 14px 15px 16px;
        font-size: 16px;
        line-height: 1.45;
        text-align: left;
      }

      .lightbox {
        padding: 14px;
      }

      .lightbox img {
        max-width: 95vw;
        max-height: 72vh;
      }

      .lb-prev {
        left: 8px;
      }

      .lb-next {
        right: 8px;
      }

      .lb-caption {
        right: 14px;
        bottom: 15px;
        left: 14px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body id="bodyRoot">

  <!-- Displayed only before Firebase finishes loading -->

  <div class="loading-screen" id="loadingScreen">
    Loading profile…
  </div>

  <!-- Public profile is hidden until script.js adds .is-ready -->

  <div id="app" class="is-loading">

    <div class="page-layout">

      <!-- LEFT PROFILE SECTION -->

      <main class="card" id="mainCard">

        <!-- Banner or GIF is loaded from Firebase -->

        <div class="profile-banner" id="profileBanner"></div>

        <div class="profile-main">

          <!-- Profile image overlaps banner -->

          <div class="ring-wrap">
            <div class="ring" id="ringEl"></div>

            <img
              id="profilePhoto"
              src=""
              alt="Profile photo"
            >

            <span class="status-dot" id="statusDot"></span>
          </div>

          <!-- Loaded from Firebase -->

          <h1 id="userName"></h1>

          <p class="status-text" id="statusText"></p>

          <!-- Quote is directly under name and status -->

          <div class="quote-box" id="quoteBox">
            <span class="quote-mark">“</span>
            <p id="dailyQuote"></p>
          </div>

          <!-- About section -->

          <section class="about">
            <p class="small-title">About</p>

            <h2 id="aboutTitle"></h2>

            <p id="aboutText"></p>
          </section>

          <!-- Simple logo-only link section -->

          <section class="social" id="socialSection">
            <p class="small-title">Links</p>

            <div class="links" id="linksWrap">

              <a
                href="#"
                id="snapLink"
                class="link-btn snap"
                target="_blank"
                rel="noopener"
                aria-label="Snapchat"
                title="Snapchat"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Snapchat</span>
              </a>

              <a
                href="#"
                id="discordLink"
                class="link-btn discord"
                target="_blank"
                rel="noopener"
                aria-label="Discord"
                title="Discord"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Discord</span>
              </a>

              <a
                href="#"
                id="instaLink"
                class="link-btn insta"
                target="_blank"
                rel="noopener"
                aria-label="Instagram"
                title="Instagram"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>Instagram</span>
              </a>

            </div>

            <!-- 
              WhatsApp remains hidden.
              These elements stay in HTML to prevent script.js errors.
            -->

            <div class="whatsapp-section" id="whatsappSection">

              <button
                id="waBtn"
                class="whatsapp locked"
                type="button"
              >
                <span class="icon" aria-hidden="true"></span>
                <span>WhatsApp Locked</span>
              </button>

              <div id="waRequestForm" class="wa-form hidden">
                <p class="wa-note">
                  Enter your Gmail to request WhatsApp access.
                </p>

                <input
                  type="email"
                  id="waGmail"
                  placeholder="you@gmail.com"
                  autocomplete="email"
                >

                <button id="waSubmit" class="btn-primary" type="button">
                  Send Request
                </button>

                <p id="waMsg" class="wa-msg"></p>
              </div>
            </div>
          </section>

          <footer>
            <span id="footerName"></span>
          </footer>

        </div>
      </main>

      <!-- RIGHT FIRESTORE MEMORY GALLERY -->

      <section class="memory-area" id="memorySection">

        <h2 id="memoryTitle"></h2>

        <p id="memorySubtitle"></p>

        <!-- memories.js inserts real Firestore memories here -->

        <main class="board" id="board" aria-live="polite">

          <p class="empty-note" id="boardLoading">
            Loading memories…
          </p>

          <p
            class="empty-note"
            id="boardEmpty"
            style="display:none;"
          >
            No memories added yet.
          </p>

          <p
            class="empty-note"
            id="boardError"
            style="display:none;color:#b85a7d;"
          >
            Could not load memories.
          </p>

        </main>
      </section>
    </div>
  </div>

  <!-- MEMORY IMAGE VIEWER -->

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Memory image preview"
  >
    <button
      class="lb-close"
      id="lbClose"
      type="button"
      aria-label="Close image preview"
    >
      ×
    </button>

    <button
      class="lb-nav lb-prev"
      id="lbPrev"
      type="button"
      aria-label="Previous memory"
    >
      ←
    </button>

    <img id="lbImg" src="" alt="">

    <button
      class="lb-nav lb-next"
      id="lbNext"
      type="button"
      aria-label="Next memory"
    >
      →
    </button>

    <p id="lbCaption" class="lb-caption"></p>
  </div>

  <!-- Public profile / design data -->

  <script type="module" src="script.js"></script>

  <!-- Firestore memories -->

  <script type="module" src="memories.js"></script>

</body>
</html>
