<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8147359101264114"
     crossorigin="anonymous"></script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121417">

  <title id="pageTitle">Loading</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --page: #f5f3ee;
      --paper: #fffefa;
      --text: #272224;
      --muted: #756e70;
      --line: #e5ded8;
      --accent: #b85a7d;
      --accent-soft: #fff2f5;
      --shadow: 0 8px 24px rgba(39, 30, 34, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px 20px;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      transition: background 0.2s ease;
    }

    button, input { font: inherit; }
    .hidden { display: none !important; }

    #app {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }
    #app.is-ready {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       UNIFIED LOADING SCREEN 
    ========================= */
    .unified-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #181a20 0%, #0d0f12 100%);
      color: #ffffff;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .unified-loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* --- Verified Profile --- */
    .loader-profile {
      display: flex;
      align-items: center;
      gap: 22px;
      animation: elegantPulse 2.5s infinite ease-in-out alternate;
    }
    .loader-avatar-wrapper {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 2px solid #ffb6c1; 
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 182, 193, 0.15);
      flex-shrink: 0;
    }
    .loader-avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .loader-text-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .loader-username {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 28px;
      font-weight: 700;
      font-family: "Manrope", sans-serif;
      letter-spacing: -0.02em;
    }
    .verified-badge {
      width: 24px;
      height: 24px;
      fill: #2398ff;
      filter: drop-shadow(0 0 8px rgba(35, 152, 255, 0.6));
    }
    .loader-displayname {
      font-size: 17px;
      color: #eaeaea;
      font-weight: 500;
      font-family: "Manrope", sans-serif;
    }
    @keyframes elegantPulse {
      0% { transform: translateY(0px) scale(0.99); opacity: 0.9; }
      100% { transform: translateY(-2px) scale(1.01); opacity: 1; }
    }

    /* --- Portfolio Collage --- */
    .portfolio-part {
      margin-top: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .collage-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .letter-anim {
      opacity: 0;
      animation: smoothReveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes smoothReveal {
      0% { opacity: 0; transform: translateY(15px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Base styling for collage letters */
    .cut {
      display: inline-block;
      padding: 8px 14px;
      font-size: 45px;
      font-weight: 800;
      color: #fff;
      box-shadow: 2px 3px 8px rgba(0,0,0,0.5);
      border-radius: 2px 5px 3px 4px;
      text-transform: uppercase;
    }

    .l-P { background: #5673d3; font-family: 'Manrope', sans-serif; transform: rotate(-5deg); }
    .l-O1 { background: #e9712a; font-family: 'Fraunces', serif; transform: rotate(4deg); padding: 6px 12px; color: #fff;}
    .l-R { background: #269641; font-family: 'DM Mono', monospace; transform: rotate(-2deg); }
    .l-T { background: #c33139; font-family: 'Manrope', sans-serif; transform: rotate(5deg); color: #f5cfcf; padding: 10px 16px;}
    .l-F { background: #e3d2be; font-family: 'Fraunces', serif; transform: rotate(-3deg); color: #222; font-size: 52px; text-transform: lowercase; }
    .l-O2 { background: #1a1a1a; font-family: 'Manrope', sans-serif; transform: rotate(2deg); border: 2px solid #555; }
    .l-L { background: #e5b326; font-family: 'Manrope', sans-serif; transform: rotate(-4deg); color: #111; text-transform: lowercase;}
    .l-I { background: #b0c0c9; font-family: 'Fraunces', serif; transform: rotate(5deg); color: #111; padding: 8px 12px;}
    .l-O3 { background: #c91b26; font-family: 'Manrope', sans-serif; transform: rotate(-2deg); }

    .portfolio-footer {
      margin-top: 30px;
      color: #ffffff;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInFooter 0.8s ease 2.7s forwards;
    }
    @keyframes fadeInFooter {
      to { opacity: 1; }
    }


    /* =========================
       PAGE LAYOUT & MAIN APP
    ========================= */
    .page-layout {
      display: grid;
      grid-template-columns: 365px minmax(0, 1fr);
      gap: 46px;
      width: min(1120px, 100%);
      margin: 0 auto;
      align-items: start;
    }

    #mainCard.card {
      position: sticky;
      top: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: background 0.2s ease, box-shadow 0.2s ease;
      z-index: 10;
    }

    .profile-banner {
      width: 100%;
      height: 205px;
      background: #e8e1dc;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: height 0.2s ease;
    }

    .profile-main { padding: 0 20px 25px; }

    .ring-wrap {
      position: relative;
      display: flex;
      width: 106px;
      height: 106px;
      margin-top: -48px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 5px 15px rgba(40, 30, 34, 0.12);
      transition: border-radius 0.2s ease;
    }

    .ring {
      position: absolute;
      inset: -3px;
      z-index: 1;
      border: 2px solid var(--paper);
      border-radius: inherit;
      pointer-events: none;
    }

    #profilePhoto {
      position: relative;
      z-index: 2;
      display: none;
      width: 100%;
      height: 100%;
      border: 4px solid var(--paper);
      border-radius: inherit;
      object-fit: cover;
      object-position: center;
      filter: none !important;
      opacity: 1 !important;
      mix-blend-mode: normal !important;
      box-shadow: none !important;
      background: transparent !important;
      transition: border-radius 0.2s ease;
    }
    #profilePhoto.visible { display: block; }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 5px;
      z-index: 4;
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: #2fca76;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
    }
    .status-dot.visible { display: block; }
    .status-dot.away { background: #f0ad35; }
    .status-dot.offline { background: #999598; }

    #userName {
      min-height: 34px;
      margin: 0 0 4px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.3;
    }

    .status-text {
      min-height: 16px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    .quote-box {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
    }
    .quote-mark { display: none; }
    #dailyQuote {
      min-height: 18px;
      margin: 0;
      color: #5d4d53;
      font-family: "Fraunces", serif;
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.65;
    }

    .about {
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }
    .small-title {
      margin: 0 0 12px;
      color: #9a858b;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    #aboutTitle {
      min-height: 28px;
      margin: 0 0 13px;
      color: var(--text);
      font-family: "Fraunces", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
    }
    #aboutText {
      min-height: 20px;
      margin: 0;
      color: #514a4c;
      font-family: "Fraunces", serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.8;
      white-space: pre-line;
    }

    .social {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .link-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: #494143;
      text-decoration: none;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }
    .link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .link-btn .icon {
      display: grid !important;
      width: 21px;
      height: 21px;
      font-size: 20px;
      place-items: center;
    }
    .links .link-btn > span:last-child { display: none; }
    .snap .icon::before { content: "\f2ab"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }
    .discord .icon::before { content: "\f392"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }
    .insta .icon::before { content: "\f16d"; font-family: "Font Awesome 6 Brands"; font-weight: 400; }

    #whatsappSection { display: none !important; }
    footer {
      min-height: 15px;
      margin-top: 20px;
      color: #978d90;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-align: center;
    }

    /* =========================
       NEW STORY SECTION (RIGHT SIDE)
    ========================= */
    .story-section {
      min-width: 0;
      opacity: 0;
      transform: translateY(30px);
      /* This animation triggers right after the 4.5s loading sequence finishes */
      animation: slideUpStory 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 4.6s forwards;
    }

    @keyframes slideUpStory {
      to { opacity: 1; transform: translateY(0); }
    }

    .story-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 68px); 
      min-height: 500px;
      max-height: 850px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      background: #e9e3df;
    }

    .story-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Scaling by 1.15 hides the "Made with AI" watermark */
      transform: scale(1.15) translate(-3%, 3%);
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Professional Parallax Hover Animation */
    .story-container:hover .story-image {
      transform: scale(1.22) translate(-3%, 3%);
    }

    /* Dark gradient at the bottom for text readability */
    .story-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20, 16, 18, 0.85) 0%, rgba(20, 16, 18, 0) 50%);
      display: flex;
      align-items: flex-end;
      padding: 34px;
      pointer-events: none;
    }

    .story-title {
      color: #fffefa;
      font-family: "Fraunces", serif;
      font-size: 48px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
      transform: translateY(15px);
      opacity: 0;
      animation: slideUpStoryText 0.8s ease 5s forwards;
    }

    @keyframes slideUpStoryText {
      to { opacity: 1; transform: translateY(0); }
    }


    /* =========================
       TABLET & MOBILE
    ========================= */
    @media (max-width: 820px) {
      body { padding: 18px 13px 32px; }
      .page-layout { grid-template-columns: 1fr; gap: 30px; width: min(600px, 100%); }
      #mainCard.card { position: relative; top: auto; }
      .story-container { height: 500px; }
    }
    
    @media (max-width: 500px) {
      body { padding: 10px; }
      
      .loader-profile { flex-direction: column; text-align: center; gap: 14px; }
      .loader-avatar-wrapper { width: 90px; height: 90px; }
      .loader-username { font-size: 24px; justify-content: center; }
      .loader-displayname { font-size: 15px; }
      
      .portfolio-part { margin-top: 35px; }
      .cut { font-size: 28px; padding: 6px 10px; }
      .l-F { font-size: 34px; }
      .portfolio-footer { font-size: 11px; margin-top: 25px;}

      .profile-banner { height: 155px; }
      .profile-main { padding: 0 16px 20px; }
      .ring-wrap { width: 92px; height: 92px; margin-top: -43px; }
      #userName { font-size: 24px; }
      #aboutTitle { font-size: 17px; }
      #aboutText { font-size: 14px; }
      
      /* Story sits right under profile automatically */
      .story-container { height: 480px; }
      .story-overlay { padding: 24px; }
      .story-title { font-size: 38px; }
    }
  </style>
</head>

<body id="bodyRoot">

  <!-- DUMMY LOADER: Prevents external script.js from ruining sequence -->
  <div id="loadingScreen" style="display: none;"></div>

  <!-- THE REAL UNIFIED LOADING SCREEN -->
  <div class="unified-loading-screen" id="realLoadingScreen">
    
    <!-- 1. Verified Profile -->
    <div class="loader-profile">
      <div class="loader-avatar-wrapper">
        <img src="https://i.ibb.co/2082XnHx/yellow-pfp.jpg" alt="Profile Loading">
      </div>
      <div class="loader-text-info">
        <div class="loader-username">
          fl0werr_bbyy
          <svg class="verified-badge" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.666 2.005C11.862 1.956 12.138 1.956 12.334 2.005L14.774 2.615C14.975 2.665 15.228 2.76 15.397 2.906L17.279 4.536C17.433 4.669 17.65 4.886 17.783 5.04L19.413 6.923C19.559 7.091 19.654 7.344 19.704 7.545L20.314 9.985C20.363 10.181 20.363 10.457 20.314 10.653L19.704 13.093C19.654 13.294 19.559 13.547 19.413 13.715L17.783 15.598C17.65 15.752 17.433 15.969 17.279 16.102L15.397 17.732C15.228 17.878 14.975 17.973 14.774 18.023L12.334 18.633C12.138 18.682 11.862 18.682 11.666 18.633L9.226 18.023C9.025 17.973 8.772 17.878 8.603 17.732L6.721 16.102C6.567 15.969 6.35 15.752 6.217 15.598L4.587 13.715C4.441 13.547 4.346 13.294 4.296 13.093L3.686 10.653C3.637 10.457 3.637 10.181 3.686 9.985L4.296 7.545C4.346 7.344 4.441 7.091 4.587 6.923L6.217 5.04C6.35 4.886 6.567 4.669 6.721 4.536L8.603 2.906C8.772 2.76 9.025 2.665 9.226 2.615L11.666 2.005Z" fill="#1DA1F2"/>
            <path d="M10.233 14.283L7.756 11.806L8.817 10.745L10.233 12.161L15.183 7.211L16.244 8.272L10.233 14.283Z" fill="white"/>
          </svg>
        </div>
        <div class="loader-displayname">Arushi 🤍🌸</div>
      </div>
    </div>

    <!-- 2. Portfolio Cutouts -->
    <div class="portfolio-part" id="portfolioPart">
      <div class="collage-wrapper">
        <div class="letter-anim" style="animation-delay: 1.5s"><span class="cut l-P">P</span></div>
        <div class="letter-anim" style="animation-delay: 1.6s"><span class="cut l-O1">o</span></div>
        <div class="letter-anim" style="animation-delay: 1.7s"><span class="cut l-R">r</span></div>
        <div class="letter-anim" style="animation-delay: 1.8s"><span class="cut l-T">t</span></div>
        <div class="letter-anim" style="animation-delay: 1.9s"><span class="cut l-F">f</span></div>
        <div class="letter-anim" style="animation-delay: 2.0s"><span class="cut l-O2">o</span></div>
        <div class="letter-anim" style="animation-delay: 2.1s"><span class="cut l-L">l</span></div>
        <div class="letter-anim" style="animation-delay: 2.2s"><span class="cut l-I">i</span></div>
        <div class="letter-anim" style="animation-delay: 2.3s"><span class="cut l-O3">o</span></div>
      </div>
      <div class="portfolio-footer">Arushi Patel | Designer. 2026</div>
    </div>
  </div>

  <!-- MAIN APP PROFILE -->
  <div id="app" class="is-loading">
    <div class="page-layout">
      
      <!-- LEFT: Profile Card -->
      <main class="card" id="mainCard">
        <div class="profile-banner" id="profileBanner"></div>
        <div class="profile-main">
          <div class="ring-wrap">
            <div class="ring" id="ringEl"></div>
            <img id="profilePhoto" src="" alt="Profile photo">
            <span class="status-dot" id="statusDot"></span>
          </div>
          <h1 id="userName"></h1>
          <p class="status-text" id="statusText"></p>
          <div class="quote-box" id="quoteBox">
            <span class="quote-mark">“</span>
            <p id="dailyQuote"></p>
          </div>
          <section class="about">
            <p class="small-title">About</p>
            <h2 id="aboutTitle"></h2>
            <p id="aboutText"></p>
          </section>
          <section class="social" id="socialSection">
            <p class="small-title">Links</p>
            <div class="links" id="linksWrap">
              <a href="#" id="snapLink" class="link-btn snap" target="_blank" rel="noopener" aria-label="Snapchat" title="Snapchat">
                <span class="icon" aria-hidden="true"></span><span>Snapchat</span>
              </a>
              <a href="#" id="discordLink" class="link-btn discord" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
                <span class="icon" aria-hidden="true"></span><span>Discord</span>
              </a>
              <a href="#" id="instaLink" class="link-btn insta" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
                <span class="icon" aria-hidden="true"></span><span>Instagram</span>
              </a>
            </div>
            <div class="whatsapp-section" id="whatsappSection">
              <button id="waBtn" class="whatsapp locked" type="button">
                <span class="icon" aria-hidden="true"></span><span>WhatsApp Locked</span>
              </button>
              <div id="waRequestForm" class="wa-form hidden">
                <p class="wa-note">Enter your Gmail to request WhatsApp access.</p>
                <input type="email" id="waGmail" placeholder="you@gmail.com" autocomplete="email">
                <button id="waSubmit" class="btn-primary" type="button">Send Request</button>
                <p id="waMsg" class="wa-msg"></p>
              </div>
            </div>
          </section>
          <footer><span id="footerName"></span></footer>
        </div>
      </main>

      <!-- RIGHT: Animated Story Section -->
      <section class="story-section" id="storySection">
        <div class="story-container">
          <!-- Make sure this image file is saved in the exact same folder as your HTML file! -->
          <img class="story-image" src="Copilot_20261010_194015.png" alt="My Story">
          <div class="story-overlay">
            <h2 class="story-title">Story</h2>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- HIDDEN LEGACY ELEMENTS (Crucial: Prevents your script.js and memories.js from crashing!) -->
  <div id="hidden-legacy-elements" style="display: none !important;" aria-hidden="true">
    <section class="memory-area" id="memorySection">
      <h2 id="memoryTitle"></h2>
      <p id="memorySubtitle"></p>
      <main class="board" id="board" aria-live="polite">
        <p class="empty-note" id="boardLoading"></p>
        <p class="empty-note" id="boardEmpty"></p>
        <p class="empty-note" id="boardError"></p>
      </main>
    </section>
    <div class="lightbox" id="lightbox">
      <button class="lb-close" id="lbClose"></button>
      <button class="lb-nav lb-prev" id="lbPrev"></button>
      <img id="lbImg" src="" alt="">
      <button class="lb-nav lb-next" id="lbNext"></button>
      <p id="lbCaption" class="lb-caption"></p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="memories.js"></script>

  <!-- SEQUENCE MANAGER -->
  <script>
    setTimeout(() => {
      const realLoader = document.getElementById('realLoadingScreen');
      const app = document.getElementById('app');
      
      // Hide the intro sequence
      if (realLoader) {
        realLoader.classList.add('hide');
      }
      
      // Reveal the main website profile
      if (app && !app.classList.contains('is-ready')) {
        app.classList.add('is-ready');
        app.classList.remove('is-loading');
      }
    }, 4500); // Intro Sequence ends exactly at 4.5s
  </script>

</body>
</html>
