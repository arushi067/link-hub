<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Arushi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">✨ Admin</div>
    <nav>
      <button class="tab-btn active" data-tab="profile">👤 Profile</button>
      <button class="tab-btn" data-tab="theme">🎨 Theme & Animation</button>
      <button class="tab-btn" data-tab="links">🔗 Links</button>
      <button class="tab-btn" data-tab="memories">🖼️ Memories</button>
      <button class="tab-btn" data-tab="requests">📩 WhatsApp Requests</button>
    </nav>
    <div class="save-status" id="saveStatus"></div>
  </aside>

  <main class="content">

    <section class="tab-panel active" id="tab-profile">
      <h2>Profile Info</h2>
      <div class="grid2">
        <label>Name<input type="text" id="fName" placeholder="Arushi Patel"></label>
        <label>Photo URL<input type="text" id="fPhoto" placeholder="https://..."></label>
        <label>Status Text<input type="text" id="fStatusText" placeholder="Online and working"></label>
        <label>Status Emoji<input type="text" id="fStatusEmoji" placeholder="💻"></label>
        <label>Online Status
          <select id="fOnlineStatus">
            <option value="online">🟢 Online</option>
            <option value="away">🟡 Away</option>
            <option value="dnd">🔴 Do Not Disturb</option>
            <option value="offline">⚪ Offline</option>
          </select>
        </label>
        <label>Quote of the Day<input type="text" id="fQuote"></label>
        <label>Pronouns<input type="text" id="fPronouns" placeholder="She/Her"></label>
        <label>Location<input type="text" id="fLocation" placeholder="Ahmedabad"></label>
        <label>Birthday<input type="text" id="fBirthday" placeholder="12 May"></label>
        <label>Mood<input type="text" id="fMood" placeholder="Happy 😊"></label>
      </div>
      <button class="save-btn" id="saveProfile">Save Profile</button>
    </section>

    <section class="tab-panel" id="tab-theme">
      <h2>Theme & Background Animation</h2>
      <div class="grid2">
        <label>Color Theme
          <select id="fTheme">
            <option value="pink">🌸 Pink</option>
            <option value="dark">🌑 Dark</option>
            <option value="purple">🔮 Purple</option>
            <option value="ocean">🌊 Ocean</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="midnight">🌌 Midnight</option>
          </select>
        </label>
        <label>Font
          <select id="fFont">
            <option value="poppins">Poppins</option>
            <option value="quicksand">Quicksand</option>
            <option value="playfair">Playfair Display</option>
            <option value="caveat">Caveat (handwriting)</option>
          </select>
        </label>
        <label>Accent Color <input type="color" id="fAccent" value="#ff5fa2"></label>
        <label>Secondary Color <input type="color" id="fSecond" value="#7f5fff"></label>

        <label>Background Animation
          <select id="fAnimation">
            <option value="aurora">🌈 Aurora Gradient Shift</option>
            <option value="blobs">🫧 Floating Gradient Blobs</option>
            <option value="stars">✨ Starry Night + Shooting Stars</option>
            <option value="bubbles">🔵 Rising Bubbles</option>
            <option value="wave">🌀 Purple Wave Shift</option>
            <option value="video">🎬 Custom Video Background</option>
            <option value="none">⬜ None (Static)</option>
          </select>
        </label>
        <label>Video URL (if animation = Video)<input type="text" id="fBgVideo" placeholder="https://..."></label>
        <label>Sparkle Particles Overlay
          <select id="fParticles">
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </label>
        <label>Card Opacity (%)<input type="number" id="fCardOpacity" min="50" max="100" value="100"></label>
      </div>

      <div class="preview-note">💡 Preview live changes by opening your site in another tab after saving.</div>
      <button class="save-btn" id="saveTheme">Save Theme</button>
    </section>

    <section class="tab-panel" id="tab-links">
      <h2>Links & Extras</h2>
      <div class="grid2">
        <label>Snapchat URL<input type="text" id="fSnap"></label>
        <label>Discord URL<input type="text" id="fDiscord"></label>
        <label>Instagram URL<input type="text" id="fInsta"></label>
        <label>WhatsApp Number<input type="text" id="fWaNumber" placeholder="+91..."></label>
        <label>Custom Link 1 Label<input type="text" id="fCustom1Label"></label>
        <label>Custom Link 1 URL<input type="text" id="fCustom1Url"></label>
        <label>Custom Link 2 Label<input type="text" id="fCustom2Label"></label>
        <label>Custom Link 2 URL<input type="text" id="fCustom2Url"></label>
        <label>Click Sound URL<input type="text" id="fClickSound" placeholder="https://.../click.mp3"></label>
        <label>Xbox Gamertag<input type="text" id="fXboxGamertag" placeholder="Aruu079225"></label>
      </div>
      <button class="save-btn" id="saveLinks">Save Links</button>
    </section>

    <section class="tab-panel" id="tab-memories">
      <h2>Memories Gallery</h2>
      <div class="grid2">
        <label>Image URL<input type="text" id="memImage" placeholder="https://..."></label>
        <label>Caption<input type="text" id="memCaption" placeholder="Memory 1"></label>
      </div>
      <button class="save-btn" id="addMemory">➕ Add Memory</button>
      <div id="memoryList" class="memory-list"></div>
    </section>

    <section class="tab-panel" id="tab-requests">
      <h2>WhatsApp Access Requests</h2>
      <div id="requestList" class="request-list"></div>
    </section>

  </main>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
